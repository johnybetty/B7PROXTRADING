name: Build Android APK (B7PROX TRADING)

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Ensure Python Files Synced
        run: |
          mkdir -p android_project/app/src/main/python
          cp -u *.py android_project/app/src/main/python/ || true
          ls -la android_project/app/src/main/python/

      - name: Setup Gradle Wrapper
        run: |
          cd android_project
          gradle wrapper --gradle-version 8.6
          chmod +x gradlew

      - name: Build APK with Gradle
        run: |
          cd android_project
          ./gradlew assembleDebug --stacktrace

      - name: Rename & Prepare APK Artifact
        run: |
          mkdir -p release_apk
          cp android_project/app/build/outputs/apk/debug/*.apk release_apk/B7PROXTRADING-debug.apk
          ls -lh release_apk/

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: B7PROXTRADING-v1.0-APK
          path: release_apk/B7PROXTRADING-debug.apk
          retention-days: 30
